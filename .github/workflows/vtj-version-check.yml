# .github/workflows/vtj-version-check.yml
name: VTJ Version Consistency Check

on:
  push:
    paths:
      - '.vtj/vue/**'
      - '.vtj/files/**'
  pull_request:
    paths:
      - '.vtj/vue/**'
      - '.vtj/files/**'

jobs:
  vtj-version-check:
    name: VTJ Version Consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整历史用于对比
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 仅安装脚本需要的依赖
      
      - name: Check VTJ version consistency
        run: |
          echo "🔍 检查 VTJ 版本一致性（--check 只读比对，不写入）..."
          python scripts/vtj_version_sync.py --check
        continue-on-error: false
      
      - name: Comment on PR (if failed)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## ❌ VTJ 版本不一致检测失败
              
              请运行以下命令同步版本号后再提交：
              
              \`\`\`bash
              python scripts/vtj_version_sync.py
              \`\`\`
              
              或手动更新 \`.vtj/files/*.json\` 的 \`__VERSION__\` 字段，使其与 \`.vtj/vue/*.vue\` 中的 \`useProvider({version})\` 一致。`
            })

  # Python 代码质量检查
  python-quality:
    name: Python Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install black isort flake8 mypy
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      # 阻断项：注解在 Python < 3.14 是立即求值的，模块级函数签名里引用「后面才 import 的
      # 名字」会在 3.11/3.13 直接 NameError（2026-11-04 的 UploadFile 事故）。
      - name: Eager-annotation import check (blocking)
        run: |
          python backend/scripts/gates/check_eager_annotations.py

      - name: Compile check (blocking)
        run: |
          python -m compileall -q backend/app && echo "compileall OK"

      # 说明（2026-11-04）：black/isort/flake8 在本仓库从未全面落地（451+ 个历史文件不符合
      # black 格式），且开发机无这些工具；因此这三个步骤改为「提示项」不阻断，避免长期红灯
      # 掩盖真问题。新增代码仍建议本地跑一次 black。真正的阻断项是上面的注解检查与编译检查。
      - name: Run black (advisory)
        continue-on-error: true
        run: |
          black --check --line-length=100 backend/ --exclude="\.vtj|migrations|alembic"

      - name: Run isort (advisory)
        continue-on-error: true
        run: |
          isort --check --profile=black --line-length=100 backend/ --exclude="\.vtj|migrations|alembic"

      - name: Run flake8 (advisory)
        continue-on-error: true
        run: |
          flake8 backend/ --max-line-length=100 --ignore=E203,W503 --exclude="\.vtj,migrations,alembic"

      - name: Run mypy (advisory)
        continue-on-error: true
        run: |
          mypy backend/ --exclude="\.vtj|migrations|alembic" --ignore-missing-imports || true

  # 前端代码质量检查
  frontend-quality:
    name: Frontend Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # 2026-11-04：node 20 自带 npm 10，与 package-lock.json（npm 11 生成、含 vue-tsc 3.x 树）
      # 解析结果不一致 → `npm ci` 报 EUSAGE「Missing: vue-tsc@… from lock file」，安装步骤直接失败。
      # 升到 node 24（npm 11）与锁文件生成环境一致；package.json engines 为 >=20.19 <25，允许 24。
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      
      - name: Install dependencies
        run: |
          npm ci
      
      - name: Run prettier (check only)
        continue-on-error: true
        run: |
          npx prettier --check . --ignore-path .gitignore
      
      - name: Run ESLint
        run: |
          npx eslint . --ext .vue,.js,.ts --ignore-path .gitignore || true

  # 单元测试
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi
      
      - name: Run unit tests
        run: |
          cd backend
          pytest tests/unit -v --tb=short --cov=app.services --cov-report=xml || true
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./backend/coverage.xml
          fail_ci_if_error: false

  # 数据库建表冒烟（项目用 create_all 自动建表，无 alembic 体系）
  migration-test:
    name: Database Schema Smoke (create_all)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f backend/requirements.txt ]; then
            pip install -r backend/requirements.txt
          fi

      - name: Schema smoke (create_all on in-memory SQLite)
        run: |
          cd backend
          # 项目采用 Base.metadata.create_all 自动建表（无 alembic.ini / versions 目录），
          # 此处用内存 SQLite 验证全部 ORM 模型可导入、空库成功建表
          python scripts/smoke_create_all.py
        env:
          DB_TYPE: sqlite

  # 汇总报告
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [vtj-version-check, python-quality, frontend-quality, unit-tests, migration-test]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          echo "## CI 结果汇总"
          echo ""
          echo "| Job | Status |"
          echo "|-----|--------|"
          echo "| VTJ Version Check | ${{ needs.vtj-version-check.result }} |"
          echo "| Python Quality | ${{ needs.python-quality.result }} |"
          echo "| Frontend Quality | ${{ needs.frontend-quality.result }} |"
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |"
          echo "| Schema Smoke (create_all) | ${{ needs.migration-test.result }} |"
          
          # 检查是否有失败
          if [[ "${{ needs.vtj-version-check.result }}" != "success" ]] || \
             [[ "${{ needs.python-quality.result }}" != "success" ]] || \
             [[ "${{ needs.frontend-quality.result }}" != "success" ]] || \
             [[ "${{ needs.unit-tests.result }}" != "success" ]] || \
             [[ "${{ needs.migration-test.result }}" != "success" ]]; then
            echo ""
            echo "❌ 部分检查失败，请查看详细日志"
            exit 1
          else
            echo ""
            echo "✅ 所有检查通过"
          fi