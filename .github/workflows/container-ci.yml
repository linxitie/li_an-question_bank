name: container-ci

'on':
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  PYTHONIOENCODING: utf-8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend deps
        run: pip install -r backend/requirements.txt
      - name: Targeted backend tests
        run: |
          cd backend
          python -m pytest tests/test_xingce_material_sets.py tests/test_ocr_markdown_normalization.py tests/test_paper_group_payload.py tests/test_question_media.py -q
      - name: Gates quick
        run: cd backend && python scripts/gates/gate_all.py --quick
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: deploy/Dockerfile.web
            build_args: ''
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            build_args: 'INSTALL_PLAYWRIGHT_BROWSERS=0'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.name }} (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: false
          build-args: ${{ matrix.build_args }}
          tags: liankao/${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  build-parser:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build parser (manual only, 3GB image)
        uses: docker/build-push-action@v6
        with:
          context: backend/parser
          file: backend/parser/Dockerfile
          push: false
          load: false
          tags: liankao/parser:ci
          cache-from: type=gha,scope=parser
          cache-to: type=gha,mode=max,scope=parser

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            context: .
            dockerfile: deploy/Dockerfile.web
            build_args: ''
          - name: backend
            context: backend
            dockerfile: backend/Dockerfile
            build_args: 'INSTALL_PLAYWRIGHT_BROWSERS=0'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push ${{ matrix.name }} tag (never latest)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ matrix.build_args }}
          tags: ghcr.io/${{ github.repository_owner }}/liankao-${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}