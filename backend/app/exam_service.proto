syntax = "proto3";

package exam;

service QuestionBankService {
    rpc GetQuestion (QuestionRequest) returns (QuestionResponse);
    rpc SearchQuestions (SearchRequest) returns (QuestionsListResponse);
    rpc CreateQuestion (CreateQuestionRequest) returns (QuestionResponse);
}

service ExamService {
    rpc StartExam (StartExamRequest) returns (ExamRecordResponse);
    rpc SubmitAnswer (SubmitAnswerRequest) returns (SubmitAnswerResponse);
    rpc GetExamResult (ExamResultRequest) returns (ExamResultResponse);
}

message QuestionRequest {
    int64 question_id = 1;
}

message QuestionResponse {
    int64 question_id = 1;
    string content = 2;
    string answer = 3;
    int32 difficulty = 4;
}

message SearchRequest {
    int32 subject_id = 1;
    int32 type_id = 2;
    int32 difficulty = 3;
    int32 limit = 4;
}

message QuestionsListResponse {
    repeated QuestionResponse questions = 1;
}

message CreateQuestionRequest {
    int32 subject_id = 1;
    int32 type_id = 2;
    string content = 3;
    string answer = 4;
    int64 creator_id = 5;
}

message StartExamRequest {
    int64 paper_id = 1;
    int64 user_id = 2;
    string exam_type = 3;
}

message ExamRecordResponse {
    int64 record_id = 1;
    int64 paper_id = 2;
    int64 user_id = 3;
    string start_time = 4;
}

message SubmitAnswerRequest {
    int64 record_id = 1;
    int64 question_id = 2;
    string answer = 3;
}

message SubmitAnswerResponse {
    bool success = 1;
    string error = 2;
}

message ExamResultRequest {
    int64 record_id = 1;
}

message ExamResultResponse {
    int64 record_id = 1;
    float total_score = 2;
    bool is_completed = 3;
}