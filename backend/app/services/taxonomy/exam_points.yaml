      patterns: ['(宣传|推介).{0,8}(稿|报道|材料)', (宣传报道稿|案例介绍材料)]
  12:
    name: 议论文写作
    points:
    - id: 55
      name: 命题作文
      keywords: [为题写一篇, 为题, 以此为题]
      patterns: ['以.{0,20}为题.{0,10}(写|撰写)']
    - id: 56
      name: 话题作文
      keywords: [为话题, 话题]
      patterns: ['(围绕|以).{0,20}(话题|主题)']
    - id: 57
      name: 材料作文
      keywords: [根据材料, 结合材料, 自选角度, 自拟标题, 参考给定资料]
