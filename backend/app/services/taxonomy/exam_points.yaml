# 91 个考点关键词规则库（v8 / M2）
# 来源：docs/design/三层分类基线_v1.json 实测 91 条 level=2 规范考点。
# 约定：keywords 命中按词长计分（>=4→3、3→2、2→2、1→1）；patterns 命中 3 分；
#       subjects 用于 sub_category 为空时按科目放宽候选集。
version: 2
subjects:
  1: [1, 2, 3, 4, 5, 6, 7, 16]
  2: [8, 9, 10, 11, 12]
  3: [13, 14, 15]
sub_categories:
  1:
    name: 政治理论
    points:
    - id: 1
      name: 习近平新时代中国特色社会主义思想
      keywords: [习近平新时代中国特色社会主义思想, 习近平, 新时代, 十个明确, 十四个坚持, 两个确立, 两个维护, 人类命运共同体, 中国式现代化, 总体国家安全观, 强军目标, 统一战线, 现代化产业体系, 生态文明思想, 文化自信, 人民至上, 总书记, 强国建设, 民族复兴, 新质生产力, 全过程人民民主]
    - id: 2
      name: 党的二十大精神
      keywords: [二十大, 二十届, 伟大建党精神, 三个务必, 两个务必, 中国式现代化, 全面从严治党, 党的自我革命, 二十届三中全会, 全会, 报告指出, 自我革命]
    - id: 3
      name: 马克思主义基本原理
      keywords: [马克思主义, 唯物, 唯心, 辩证法, 矛盾, 量变, 质变, 否定之否定, 剩余价值, 生产力, 生产关系, 价值规律, 实践与认识, 哲学原理, 社会存在, 上层建筑, 意识, 物质]
    - id: 4
      name: 党和国家方针政策
      keywords: [方针政策, 十四五, 乡村振兴, 共同富裕, 新发展理念, 高质量发展, 规划纲要, 中央一号文件, 政府工作报告, 法治政府建设, 首都功能核心区, 城市副中心, 一带一路, 扩大内需, 民营经济, 规划, 纲要, 改革, 试点, 首都, 扩大开放, 稳就业]
    - id: 5
      name: 政治立场与政治敏锐性
      keywords: [政治立场, 政治敏锐, 鉴别力, 旗帜鲜明, 政治站位, 政治方向, 政治判断力, 政治领悟力, 政治执行力, 敏锐, 政治规矩]
  2:
    name: 常识判断
    points:
    - id: 6
      name: 经济常识
      keywords: [经济, GDP, 国内生产总值, 通货膨胀, 通货紧缩, 货币政策, 财政政策, 供求, 汇率, 股票, 债券, 恩格尔系数, 基尼系数, 税率, 存款利率, 市场价格, 数字经济]
    - id: 7
      name: 文化常识
      keywords: [文化, 诗词, 成语, 文学, 著作, 史记, 唐诗, 宋词, 传统节日, 戏曲, 书法, 二十四节气, 古代, 诸子百家, 孔子, 孟子, 老子, 庄子, 诗句, 名著, 世界遗产, 中轴线, 诗, 词, 典故, 文物, 节气, 传统, 绘画, 古籍, 诗人, 名句, 对联, 楹联, 古建筑, 典籍]
    - id: 8
      name: 社会常识
      keywords: [社会, 民生, 社保, 养老保险, 教育, 医疗, 人口, 就业, 社区, 慈善, 家庭急救, 生活常识, 老年人]
    - id: 9
      name: 生态常识
      keywords: [生态, 环境, 碳达峰, 碳中和, 污染, 生物多样性, 湿地, 垃圾分类, 环保, 排污, 低碳, 节能]
    - id: 10
      name: 法律常识
      keywords: [宪法, 刑法, 民法典, 违法, 犯罪, 行政, 诉讼, 合同, 侵权, 继承, 赔偿, 条例, 处罚, 判决, 法律责任]
    - id: 11
      name: 科技常识
      keywords: [科技, 航天, 卫星, 芯片, 5G, 量子, 基因, 人工智能, 核电, 高铁, 电池, 半导体, 互联网, 大数据, 新能源, 手撕钢, 天文, 发酵, 微生物, 细菌, 抗性, 酶]
    - id: 12
      name: 时政热点
      keywords: [时政, 热点, 会议, 讲话, 峰会, 出席, 考察, 指示, 论坛, 会谈, 全会, 主席令, 白皮书, 数字贸易]
  3:
    name: 言语理解与表达
    points:
    - id: 13
      name: 逻辑填空
      keywords: [依次填入, 填入划横线, 划横线部分, 最恰当的一项是, 最恰当的是, 填入括号, 最合适的一项, 填入画横线]
      patterns: ['填入.{0,8}(横线|划横线|括号)']
    - id: 14
      name: 片段阅读
      keywords: [这段文字, 作者, 主旨, 意在说明, 主要说明, 概括最准确, 接下来最可能, 文段, 意在强调, 中心思想, 主要观点, 最准确的是, 这段, 文字, 说明, 强调]
      patterns: [(这段|该段)文字, 这段文字意在]
    - id: 15
      name: 语句表达
      keywords: [语序, 排序, 语句衔接, 病句, 标点, 排列组合最连贯, 填入下面横线, 兼语句, 成分残缺, 语句排序]
      patterns: ['(排列组合|顺序).{0,6}(连贯|正确)', '填入.{0,6}横线.{0,10}(恰当|连贯)']
  4:
    name: 数量关系
    points:
    - id: 19
      name: 数字推理
      keywords: [数列, 下一项, 数字推理, 相邻两项, 未知项, 括号处]
      patterns: ['\d+\s*[,，]\s*\d+\s*[,，]\s*\d+']
    - id: 20
      name: 数学运算
      keywords: [工程, 行程, 概率, 排列组合, 利润, 浓度, 几何, 容斥, 年龄, 时钟, 鸡兔同笼, 盈亏, 牛吃草, 多少种, 至少, 速度, 倍数, 面积, 体积, 蓄水池, 相遇, 沙漏, 圆锥, 雕像, 测量, 收费标准, 停车场, 圆锥形]
      patterns: [(多少|几分之几|多少倍|平方米|立方米), (概率|可能性)为]
  5:
    name: 判断推理
    points:
    - id: 21
      name: 图形推理
      keywords: [图形, 展开图, 立体, 旋转, 对称, 阴影, 折叠, 顺序规律, 规律性, 问号处, 九宫格, 视图, 平面图]
      patterns: ['(符合|呈现).{0,8}规律', 填入问号处]
    - id: 22
      name: 逻辑判断
      keywords: [如果, 那么, 只有, 除非, 削弱, 加强, 推出, 前提, 结论, 最能支持, 最能质疑, 假设, 论证, 推理, 反驳, 最能, 不能推出, 由此可以推出]
      patterns: ['(最能|可以).{0,4}(削弱|质疑|支持|加强|反驳)']
    - id: 23
      name: 类比推理
      keywords: [类比, 之于, 关系最为相似, 逻辑关系, 最为贴近, 最为相似]
      patterns: ['(与|和).{0,20}(关系|逻辑).{0,6}(相似|贴近|一致)']
    - id: 24
      name: 定义判断
      keywords: [定义, 属于, 不属于, 符合上述定义, 不符合, 上述定义, 根据以上定义]
      patterns: ['根据(以上|上述)?定义', '符合.{0,6}定义']
  6:
    name: 资料分析
    points:
    - id: 735
      name: 资料类型
      keywords: [文字资料, 表格, 图形, 折线图, 柱状图, 饼图, 资料]
    - id: 29
      name: 统计术语
      keywords: [同比, 环比, 增长, 比重, 百分点, 倍数, 增速, 占比, 指数, 平均数, 增长率, 比重]
    - id: 30
      name: 速算技巧
      keywords: [估算, 约为, 年均增长, 大致, 约是, 接近]
      patterns: ['(约|大约|接近).{0,10}(亿元|万元|%|倍)']
  7:
    name: 知觉速度与准确性
    points:
    - id: 31
      name: 同符查找
      keywords: [相同字符, 同符, 字符数, 相同的, 字符, 相同]
    - id: 32
      name: 数字区间定位
      keywords: [数字区间, 位于区间, 区间, 数字]
    - id: 33
      name: 字符替换
      keywords: [字符替换, 替换, 换成, 字符]
  16:
    name: 科学推理
    points:
    - id: 762
      name: 物理
      keywords: [物理, 速度, 加速度, 电路, 电流, 浮力, 压强, 杠杆, 光学, 折射, 电磁, 力学, 电压, 电阻, 功率, 凹坑, 小球, 空气阻力, 表面光滑]
    - id: 768
