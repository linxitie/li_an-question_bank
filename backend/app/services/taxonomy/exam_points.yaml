      keywords: [现象, 反映, 折射, 说明了什么]
      patterns: ['(现象|这一事件).{0,10}(反映|说明|折射)']
    - id: 43
      name: 词句理解
      keywords: [这句话, 划线句子, 含义, 内涵, 谈谈你对]
      patterns: ['(这句话|划线句子).{0,10}(含义|理解)', '谈谈你对.{0,30}(理解|认识)']
    - id: 44
      name: 评析辨析
      keywords: [评析, 评价, 辨析, 是否认同, 驳斥, 评论]
      patterns: ['(评析|评价|辨析).{0,10}', '(是否).{0,6}(认同|赞同)']
    - id: 45
      name: 比较分析
      keywords: [比较, 异同, 对比, 差异]
      patterns: ['(比较|对比).{0,10}(异同|差异|不同)']
