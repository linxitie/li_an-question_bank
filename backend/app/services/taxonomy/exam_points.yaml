      keywords: [化学, 元素, 化合物, 溶液, 氧化, 酸碱, 分子, 反应, 金属, 气体, 发酵, 微生物, 细菌, 酶, 抗性]
    - id: 773
      name: 生物
      keywords: [生物, 细胞, 遗传, 蛋白质, 光合作用, 疫苗, 人体, 酶, 微生物, 免疫]
    - id: 778
      name: 地理
      keywords: [地理, 气候, 地形, 洋流, 经纬, 板块, 季风, 时区, 海拔, 降水]
  8:
    name: 归纳概括
    points:
    - id: 35
      name: 问题概括
      keywords: [存在的主要问题, 问题, 困境, 不足, 短板, 概括]
      patterns: ['(概括|梳理|指出).{0,10}(问题|困境|不足)']
    - id: 36
      name: 原因概括
      keywords: [原因, 为什么, 成因, 归因]
      patterns: ['(分析|概括|说明).{0,8}原因']
    - id: 37
      name: 影响概括
      keywords: [影响, 意义, 作用, 危害, 后果]
      patterns: ['(概括|分析|谈谈).{0,8}(影响|意义|作用)']
    - id: 38
      name: 对策概括
      keywords: [做法, 措施, 经验, 启示, 效果, 举措]
      patterns: ['(哪些|采取了|采取了哪些).{0,6}(措施|做法|举措|经验)', '(做法|举措).{0,6}(有哪些|是什么)']
    - id: 39
      name: 特点概括
      keywords: [特点, 特征, 亮点, 特色]
      patterns: ['(概括|归纳|总结).{0,8}(特点|特征)']
    - id: 40
      name: 过程概括
      keywords: [过程, 阶段, 演变, 历程, 经过]
      patterns: ['(概括|梳理).{0,8}(过程|历程|阶段)']
  9:
    name: 综合分析
    points:
    - id: 41
      name: 观点分析
