# 可选 TLS override：仅在需要 HTTPS 时叠加。
# 用法：
#   bash deploy/gen-self-signed-cert.sh   # 仅 staging 自签
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.tls.yml \
#     --env-file deploy/.env.development up -d
services:
  web:
    ports:
      - "${HTTPS_PORT:-8443}:8443"
    volumes:
      - ./nginx.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
