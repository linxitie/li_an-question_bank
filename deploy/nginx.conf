# nginx 反向代理 —— 静态前端 + /api 反代 backend
#
# 红线（R11）：/api/v1/... 路径冻结，本文件只做透传，不改写任何路径。
#
# 容器名 backend / parser 在 liankao 网络内由 Docker DNS 解析。

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

server {
    # nginx-unprivileged 监听 8080；宿主端口由 compose 的 HTTP_PORT 映射。
    # 不在容器内以 root 绑定 80。
    listen 8080;
    server_name _;

    # 不暴露版本号；反代重定向保持相对路径，避免容器内端口泄漏到 Location。
    server_tokens off;
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    # 扫描件与大附件上传，经 nginx 时需要放宽默认 1MB 限制
    client_max_body_size 200m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/css application/javascript;
    gzip_min_length 1024;

    # ── 容器健康探针：不经 backend，直接由 nginx 应答 ──────
    # backend 健康检查走 /health；此处用 /healthz 以免两者混淆。
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API 反代 ─────────────────────────────────────────
    # 注意末尾斜杠与 upstream 的配合：此处用 proxy_pass 不带 URI 部分，
    # 保证原始 /api/... 路径原样透传到 backend。
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        # 必须用 $http_host（含端口），否则 FastAPI 的尾斜杠 307 会跳到 :80。
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # 扫描件解析可能耗时较长（OCR 单份实测约 260s），超时须给足。
        proxy_connect_timeout 60s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        proxy_buffering off;
    }

    # ── 文档与题图（backend 的静态挂载）────────────────────
    # ^~ 必须保留：否则会被下方“静态后缀”正则 location 抢先匹配，
    # 题图/文档会去 dist 目录找而 404。
    location ^~ /static/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # 题图为长期不变的内容，给足缓存
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ── 前端静态资源 ─────────────────────────────────────
    # 带内容哈希的资源可长期强缓存
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA history 路由回退 ─────────────────────────────
    # 前端是 hash 路由，但保留 fallback 以兼容未来改 history 模式。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}