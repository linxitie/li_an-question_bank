# .pre-commit-config.yaml
# VTJ 版本同步和代码质量检查

repos:
  # VTJ 版本同步检查（本地钩子）
  - repo: local
    hooks:
      - id: vtj-version-sync
        name: VTJ Version Sync Check
        entry: python scripts/vtj_version_sync.py
        language: system
        types: [file]
        files: '\.vtj/vue/.*\.vue$'
        pass_filenames: true
        always_run: false

      - id: vtj-version-sync-all
        name: VTJ Version Sync All
        entry: python scripts/vtj_version_sync.py
        language: system
        types: [file]
        files: '\.vtj/vue/.*\.vue$'
        pass_filenames: false
        always_run: true
        stages: [commit]

  # Python 代码格式化
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3
        args: [--line-length=100]
        exclude: ^(\.vtj|migrations|alembic)

  # Python 导入排序
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]
        exclude: ^(\.vtj|migrations|alembic)

  # Python 类型检查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        additional_dependencies: [sqlalchemy, fastapi, pydantic]
        exclude: ^(\.vtj|migrations|alembic|scripts)

  # Python 代码风格检查
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=100, --ignore=E203,W503]
        exclude: ^(\.vtj|migrations|alembic)

  # 通用文件检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: debug-logger
      - id: check-added-large-files
        args: ['--maxkb=500']

  # TypeScript/JavaScript 格式化 (前端)
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.3
    hooks:
      - id: prettier
        types: [typescript, vue, javascript, json, yaml, markdown]
        exclude: ^(\.vtj|node_modules|dist)
        args: [--single-quote, --tab-width=2, --print-width=100]

  # Vue 单文件组件检查
  - repo: https://github.com/vuejs/eslint-plugin-vue
    rev: v9.26.0
    hooks:
      - id: vue-eslint
        files: \.(vue)$
        exclude: ^(\.vtj|node_modules|dist)