# 兼容入口 —— 旧版编排（13 服务/命名卷/挂宿主 dist）已废弃。
#
# 新编排的唯一事实源是 deploy/docker-compose.yml；本文件用 Compose include
# 转发，避免旧文件继续被误用。推荐命令仍然显式指定新文件：
#
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env.development up -d
#
# 注意：include 需要 Docker Compose v2.20+（本机 v5.6 已满足）。

include:
  - path: deploy/docker-compose.yml
